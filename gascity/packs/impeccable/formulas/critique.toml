# Impeccable critique as a Gas City workflow.
#
# Upstream, `/impeccable critique` runs in one Claude Code context: the parent
# resolves the target, spawns Assessment A and Assessment B as isolated
# sub-agents, then synthesizes. Here each of those is a step routed to its own
# agent (its own tmux pane and Claude process). The orchestrator starts
# `assess-a` and `assess-b` together the moment `prepare` closes, and starts
# `synthesize` when both have closed.
#
# Started per project with:
#
#   gc sling <rig>/impeccable.conductor critique --formula --var target=<path-or-url>
#
# Generated by gascity/convert from skill 0.1.6, commit 9d715cc. Do not edit by hand.

formula = "critique"
description = "Impeccable design critique: two independent assessments, one synthesis, a persisted snapshot."

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.target]
description = "The surface to critique: a source path relative to the rig, or a URL"
default = "index.html"

[vars.live_url]
description = "URL where the target is already being served, if any"
default = ""

[[steps]]
id = "prepare"
title = "Prepare the critique packet"
description = """
Run the `prepare` half of your prompt for target `{{target}}`
(live URL: `{{live_url}}` if not empty).

Done when `packet.md` exists in this workflow's directory and names the
resolved target, its slug, the visitor mode, the design context files, and the
ignore list; and the step is closed with a note naming the target and slug.
"""
metadata = { "gc.run_target" = "impeccable.conductor" }

[[steps]]
id = "assess-a"
title = "Assessment A: design review"
needs = ["prepare"]
description = """
Perform Assessment A for the target named in `packet.md`. Read the packet and
the target. Do not run the detector; do not open `assessment-b.md`.

Done when `assessment-a.md` exists in this workflow's directory with every
heading your prompt lists, and the step is closed with the score and count.
"""
metadata = { "gc.run_target" = "impeccable.design-reviewer" }

[[steps]]
id = "assess-b"
title = "Assessment B: detector and browser evidence"
needs = ["prepare"]
description = """
Perform Assessment B for the target named in `packet.md`. Run the detector;
collect browser evidence if a tool for it exists. Do not open
`assessment-a.md`.

Done when `assessment-b.md` exists in this workflow's directory with every
heading your prompt lists, any live server you started is stopped, and the
step is closed with the finding count.
"""
metadata = { "gc.run_target" = "impeccable.evidence-collector" }

[[steps]]
id = "synthesize"
title = "Synthesize the critique report"
needs = ["assess-a", "assess-b"]
description = """
Run the `synthesize` half of your prompt. Read `packet.md`, `assessment-a.md`
and `assessment-b.md`; write `report.md`; persist the snapshot with
critique-storage; append the questions for the user.

Done when `report.md` exists with the full structured critique, the `Method:`
header line, the trend line, and either the questions or a `Questions skipped:`
line; the snapshot write was attempted; and the step is closed with the score
and the snapshot path.
"""
metadata = { "gc.run_target" = "impeccable.conductor" }
