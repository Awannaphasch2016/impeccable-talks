# Generated by gascity/convert from skill/agents/impeccable-documenter.md. Do not edit by hand.
#
# Impeccable tools: Read, Write, Bash, Glob, Grep
# Everything a Claude Code session offers beyond that list is launched
# disallowed, so the advisory list upstream is enforced here.
# Upstream max-turns: 30 (Gas City bounds a step by its timeout instead).
description = "Records DESIGN.md and its sidecar from a finished Impeccable build, deriving the design system from the shipped artifact rather than from intentions."
scope = "rig"
option_defaults = { effort = "medium" }
args = ["--disallowedTools", "Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,AskUserQuestion"]

# Labels this agent's Claude Code telemetry so tokens and cost can be read
# back per agent (gc derives gc.agent from an environment that, under the
# supervisor, names no agent).
[env]
OTEL_RESOURCE_ATTRIBUTES = "gc.agent=impeccable.documenter"
# Where this pack is installed and where step.sh reads and writes beads.
# Baked in at conversion time (--install-path, --api-url) so the city's
# own config needs no edit. city.toml.example shows the [workspace.env] form.
IMPECCABLE_PACK = "/opt/gascity/packs/impeccable"
IMPECCABLE_API = "http://127.0.0.1:8372/v0/city/factory"
