# Baseline arm for the Impeccable comparison.
#
# One agent, one unrestricted Claude Code session, with Impeccable's own Claude
# build installed in the rig (`npx impeccable install --providers=claude
# --scope=project`). The skill spawns Assessment A and B through Claude Code's
# Task tool, exactly as it does on a developer's machine. Gas City here is
# only the launcher and the log collector; nothing about the sub-agent fan-out
# is visible to it.
#
# Generated by gascity/convert (Impeccable skill 0.1.6, commit 9d715cc). Do not edit by hand.
#
#   gc rig add /path/to/project --name <name> --include /path/to/this/pack
#   gc sling <name>/impeccable-native.runner critique-native --formula --var target=index.html
[pack]
name = "impeccable-native"
schema = 2
description = "Impeccable critique run natively inside one Claude Code session, sub-agents via the Task tool."

[[named_session]]
template = "runner"
scope = "rig"
mode = "on_demand"
