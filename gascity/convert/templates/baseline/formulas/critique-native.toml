# Impeccable critique run natively: one step, one session, the skill does the
# fan-out itself through Claude Code's Task tool.
#
#   gc sling <rig>/@@PACK@@.runner critique-native --formula --var target=<path-or-url>
#
# Generated by gascity/convert (Impeccable @@SOURCE_VERSION@@). Do not edit by hand.

formula = "critique-native"
description = "Impeccable design critique run by the installed skill inside one Claude Code session."

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.target]
description = "The surface to critique: a source path relative to the rig, or a URL"
default = "index.html"

[[steps]]
id = "critique"
title = "Run /impeccable critique natively"
description = """
Run Impeccable's critique command on `{{target}}` using the skill installed in
this repository's `.claude/`. Follow the skill exactly: run its Setup, spawn
Assessment A and Assessment B as two isolated sub-agents through the Task tool,
synthesize, persist the snapshot with critique-storage, and read the trend.

Done when `report.md` in this workflow's directory holds the complete critique
the skill produced (with its `Method:` header line, the trend line, and either
the questions for the user or a `Questions skipped:` line), the snapshot write
was attempted, any live server is stopped, and the step is closed with the
score and the snapshot path.
"""
metadata = { "gc.run_target" = "@@PACK@@.runner" }
